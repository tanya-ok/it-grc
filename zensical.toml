[project]
site_name = "it-grc"
site_description = "Push executed security-lab evidence into CISO Assistant Community edition and verify it against a local ledger."
site_url = "https://tanya-ok.github.io/it-grc/"
repo_url = "https://github.com/tanya-ok/it-grc"
repo_name = "tanya-ok/it-grc"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/overview.css"]
exclude_docs = "local-workspace-review.md"
nav = [
  { "Overview" = "index.md" },
  { "Demo" = "demo.md" },
  { "Deployment" = "deployment.md" },
  { "Bridge" = "bridge.md" },
  { "Mapping" = "mapping.md" },
  { "Decisions" = [
  { "0001 CISO Assistant as system of record" = "adr/0001-ciso-assistant-system-of-record.md" },
] },
  { "Security" = [
  { "Security model" = "security.md" },
  { "Independent provenance" = "provenance.md" },
  { "Lab report digests" = "evidence-digests.md" },
] },
  { "Roadmap" = "roadmap.md" },
  { "Publication readiness" = "publication-readiness.md" },
]

[project.theme]
language = "en"
features = ["content.code.copy", "navigation.top", "search.highlight"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
